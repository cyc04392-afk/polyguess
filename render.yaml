# Render(render.com) 블루프린트. 저장소를 연결하고 "New > Blueprint" 를 누르면 이 파일대로 서버가 만들어집니다.
services:
  - type: web
    name: polyguess
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
