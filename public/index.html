<script>
window.__beacon = true; // 이 페이지는 게임 서버가 주므로 진단 보고를 켠다
// 부팅 감시: 코드 파일을 못 불러오거나 시작 중에 오류가 나면 빈 화면 대신 안내 상자를 띄운다(언어 파일보다 먼저 돌아서 두 언어로 적음)
(function () {
  var box = null, T0 = Date.now();
  // 서버에 짧은 보고를 남긴다(/api/log → /debug 에서 봄). window.__beacon 이 켜진 페이지(게임 서버에서 연 index/about)만.
  function beacon(ev, msg, extra) {
    if (!window.__beacon) return;
    try {
      var body = JSON.stringify({ ev: ev, msg: msg || '', extra: extra || '', url: location.href, ua: navigator.userAgent, t: Date.now() - T0, lang: (navigator.languages || [navigator.language]).join(','), w: window.innerWidth, h: window.innerHeight, vis: document.visibilityState, booted: !!window.__booted });
      if (navigator.sendBeacon) navigator.sendBeacon('/api/log', body);
      else fetch('/api/log', { method: 'POST', body: body, keepalive: true }).catch(function () {});
    } catch (e) { /* 보고 실패는 무시 */ }
  }
  window.__beacon_send = beacon;
  // 진단 스위치: 주소 뒤에 ?diag=nobg,noads,nofont,nows,nofx 또는 ?diag=lite(전부) 를 붙이면 그 부분을 끄고 연다(흰 화면 원인 찾기용, /diag.html 참고)
  var diag = {};
  try {
    var q = new URLSearchParams(location.search).get('diag') || '';
    q.split(',').forEach(function (k) { k = k.trim(); if (!k) return; if (k === 'lite') ['nobg', 'noads', 'nofont', 'nows', 'nofx'].forEach(function (x) { diag[x] = true; }); else diag[k] = true; });
    Object.keys(diag).forEach(function (k) { document.documentElement.classList.add('diag-' + k); });
    if (diag.nofont) { var fl = document.querySelector('link[rel="stylesheet"][href*="fonts.googleapis.com"]'); if (fl) fl.remove(); }
  } catch (e) { /* 스위치 해석 실패는 무시 */ }
  window.__diag = diag;
  beacon('load');
  window.addEventListener('pagehide', function (e) { beacon('pagehide', e.persisted ? 'persisted' : '', document.visibilityState); });
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') beacon('hidden'); });
  setTimeout(function () { beacon(window.__booted ? 'booted' : 'notbooted'); }, 3000);
  // 화면 상태 조사: 1.5·4·8초 뒤에 "지금 화면에 무엇이 있는지"를 살펴 보고한다(오류는 없는데 하얗게 보일 때 원인 좁히기용). /debug 에서 probe1~3 으로 보임.
  function probe(n) {
    var out = [];
    try {
      var W = window.innerWidth, H = window.innerHeight, de = document.documentElement, b = document.body;
      var desc = function (el) { if (!el) return '없음'; var s = el.tagName.toLowerCase(); if (el.id) s += '#' + el.id; var c = (typeof el.className === 'string') ? el.className.trim().split(/\s+/)[0] : ''; if (c) s += '.' + c; return s; };
      var cs = function (el) { return getComputedStyle(el); };
      var rect = function (el) { if (!el) return '없음'; var q = el.getBoundingClientRect(); return Math.round(q.width) + 'x' + Math.round(q.height) + '@' + Math.round(q.left) + ',' + Math.round(q.top) + (cs(el).display === 'none' ? '(숨김)' : ''); };
      // 1) 화면을 덮는 요소: 고정·절대 위치이면서 화면의 85% 이상을 차지하는 것
      var covers = [], all = document.querySelectorAll('body *'), i, el, r, st;
      for (i = 0; i < all.length && i < 4000; i++) {
        el = all[i]; st = cs(el); if (st.display === 'none' || st.visibility === 'hidden') continue;
        if (st.position !== 'fixed' && st.position !== 'absolute' && st.position !== 'sticky') continue;
        r = el.getBoundingClientRect(); if (r.width * r.height < W * H * 0.85) continue;
        covers.push(desc(el) + '{배경:' + st.backgroundColor + ' 투명도:' + st.opacity + ' z:' + st.zIndex + '}');
        if (covers.length >= 3) break;
      }
      out.push('덮는요소=' + (covers.length ? covers.join(' ') : '없음'));
      // 2) 화면 다섯 지점(가운데·왼쪽위·오른쪽위·위가운데·아래가운데)의 맨 위 요소
      var pts = [[W / 2, H / 2], [30, 30], [W - 30, 30], [W / 2, 90], [W / 2, H - 40]];
      out.push('맨위요소=' + pts.map(function (p) { return desc(document.elementFromPoint(p[0], p[1])); }).join(' | '));
      // 3) 본문·첫 화면·시작 버튼의 크기와 자리
      out.push('app=' + rect(document.getElementById('app')) + ' 첫화면=' + rect(document.getElementById('view-landing')) + ' 시작버튼=' + rect(document.getElementById('btn-join')) + ' 문서높이=' + de.scrollHeight + ' 스크롤=' + Math.round(window.scrollY));
      // 4) 스타일·글꼴이 먹었는지
      var bs = cs(b);
      out.push('body표시=' + bs.display + ' body배경=' + bs.backgroundColor + ' 그림=' + (bs.backgroundImage === 'none' ? '없음' : bs.backgroundImage.slice(0, 24) + '…') + ' 고정=' + bs.backgroundAttachment + ' 글꼴=' + bs.fontFamily.slice(0, 36) + ' 클래스=' + (b.className || '-') + ' view=' + (b.dataset.view || '-'));
      out.push('스타일시트=' + document.styleSheets.length + ' 글꼴상태=' + (document.fonts ? document.fonts.status + '/' + document.fonts.size + ' Jua:' + (document.fonts.check ? document.fonts.check('16px Jua') : '?') : '?'));
      // 5) body 바로 아래 자식들(확장 프로그램이 끼워 넣은 것이 있으면 여기 나타남)
      out.push('body자식(' + b.children.length + ')=' + Array.prototype.slice.call(b.children, 0, 24).map(desc).join(' '));
      // 6) 화면·창·설정
      var mm = function (q) { try { return matchMedia(q).matches ? 1 : 0; } catch (e) { return '?'; } };
      out.push('화면=' + screen.width + 'x' + screen.height + ' 창=' + window.outerWidth + 'x' + window.outerHeight + ' 안쪽=' + W + 'x' + H + ' 배율=' + window.devicePixelRatio + ' 고대비=' + mm('(forced-colors: active)') + ' 다크=' + mm('(prefers-color-scheme: dark)') + ' 포커스=' + (document.hasFocus() ? 1 : 0) + ' 보임=' + document.visibilityState);
      var brands = (navigator.userAgentData && navigator.userAgentData.brands) ? navigator.userAgentData.brands.map(function (x) { return x.brand + ' ' + x.version; }).filter(function (t) { return !/Not/.test(t); }).join(', ') : '?';
      out.push('브라우저=' + brands + (navigator.brave ? ' (Brave)' : '') + ' 메모리=' + (navigator.deviceMemory || '?') + 'GB 코어=' + (navigator.hardwareConcurrency || '?') + ' 스위치=' + (Object.keys(window.__diag || {}).join(',') || '없음'));
      // 7) 마지막 조사에서만: 그래픽 카드 이름(WebGL). 앞선 조사와 비교해 WebGL 자체가 문제인지도 가려진다.
      if (n === 3) {
        try {
          var cv = document.createElement('canvas'), gl = cv.getContext('webgl') || cv.getContext('experimental-webgl');
          if (gl) { var dbg = gl.getExtension('WEBGL_debug_renderer_info'); out.push('그래픽=' + (dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER))); var lose = gl.getExtension('WEBGL_lose_context'); if (lose) lose.loseContext(); }
          else out.push('그래픽=WebGL 안 됨');
        } catch (e) { out.push('그래픽=오류 ' + e.message); }
      }
    } catch (e) { out.push('조사오류=' + e.message); }
    beacon('probe' + n, out.join('\n'));
  }
  setTimeout(function () { probe(1); }, 1500);
  setTimeout(function () { probe(2); }, 4000);
  setTimeout(function () { probe(3); }, 8000);
  window.__probe = probe;
  function show(msg) {
    beacon('error', msg);
    try {
      if (!box) { box = document.createElement('div'); box.id = 'boot-error'; box.setAttribute('role', 'alert'); document.body.appendChild(box); }
      box.textContent = '\uac8c\uc784\uc744 \ubd88\ub7ec\uc624\ub294 \uc911 \ubb38\uc81c\uac00 \uc0dd\uacbc\uc5b4\uc694. \uc0c8\ub85c\uace0\uce68(F5)\ud574 \ubcf4\uace0, \uacc4\uc18d \uadf8\ub7ec\uba74 \uc774 \ubb38\uad6c\ub97c \uc54c\ub824 \uc8fc\uc138\uc694. / Something went wrong while loading. Refresh (F5); if it keeps happening, report this: ' + msg;
    } catch (e) { /* 안내도 못 띄우면 포기 */ }
  }
  window.addEventListener('error', function (e) {
    var t = e.target;
    if (t && t !== window && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) show('load failed: ' + (t.src || t.href || '?'));
    else if (e.message) show(e.message + ' @ ' + String(e.filename || '').split('/').pop() + ':' + e.lineno);
  }, true);
  window.addEventListener('unhandledrejection', function (e) { var r = e.reason; show((r && r.message) || String(r)); });
  setTimeout(function () { if (!window.__booted) show('boot timeout (main script did not finish)'); }, 20000);
})();
</script>
<header class="topbar">

    <svg viewBox="0 0 100 100" width="34" height="34" aria-hidden="true"><polygon points="50,8 90,30 50,52 10,30" fill="#ffd23f"/><polygon points="10,30 50,52 50,96 10,74" fill="#b89cff"/><polygon points="90,30 50,52 50,96 90,74" fill="#ff5c7a"/></svg>
    <span data-i18n="폴리게스">폴리게스</span><small class="latin-name">PolyGuess</small>
  </a>

  <div class="top-right">
    <span id="lang-slot"></span>
    <span id="room-chip" class="chip hidden"></span>
    <span id="conn" class="conn" data-i18n-title="서버 연결 상태" title="서버 연결 상태" data-i18n="연결 중…">연결 중…</span>
  </div>

<main id="app">
  <!-- ───── 입장 ───── -->
  <section id="view-landing" class="view active">
    <div class="landing">
      <div class="card join-card">
        <h1 class="hero" data-i18n-html="글로 적고, <em>3D</em>로 만들고, 맞혀요!">글로 적고, <em>3D</em>로 만들고, 맞혀요!</h1>
        <div class="avatar-row">
          <div class="avatar-big" id="avatar-preview"></div>
          <button class="btn round" id="btn-avatar" data-i18n-title="다른 모양으로 바꾸기" title="다른 모양으로 바꾸기" data-i18n-aria="아바타 바꾸기" aria-label="아바타 바꾸기">🔄</button>
        </div>
        <label class="field">
          <span data-i18n="닉네임">닉네임</span>
          <input id="name" maxlength="14" data-i18n-placeholder="뭐라고 부를까요?" placeholder="뭐라고 부를까요?" autocomplete="off">
        </label>
        <div id="join-target" class="join-target hidden"></div>
        <button class="btn primary big" id="btn-join" data-i18n="시작">시작</button>
        <p class="hint-line" id="landing-hint" data-i18n="방을 새로 만들어요. 친구에게는 초대 링크를 보내 주세요.">방을 새로 만들어요. 친구에게는 초대 링크를 보내 주세요.</p>
      </div>
      <div class="card howto-card">
        <h2 data-i18n="플레이 방법">플레이 방법</h2>
        <div class="carousel" id="howto">
          <button class="car-arrow" id="howto-prev" data-i18n-aria="이전" aria-label="이전">‹</button>
          <div class="car-slide" id="howto-slide"></div>
          <button class="car-arrow" id="howto-next" data-i18n-aria="다음" aria-label="다음">›</button>
        </div>
        <div class="car-dots" id="howto-dots"></div>
      </div>
    </div>
    <p class="foot-links"><a href="/about.html" data-i18n="게임 소개 · 조작법 · 개인정보 처리방침">게임 소개 · 조작법 · 개인정보 처리방침</a></p>
  </section>

  <!-- ───── 방(로비) ───── -->
  <section id="view-lobby" class="view">
    <div class="lobby">
      <aside class="card players-card">
        <div class="players-head">
          <h2><span data-i18n="플레이어">플레이어</span> <span id="player-count">0/10</span></h2>
          <label class="maxp" id="maxp-wrap"><span data-i18n="최대">최대</span><select id="max-players"></select></label>
        </div>
        <ul class="player-list" id="player-list"></ul>
        <div class="chat" id="lobby-chat">
          <div class="chat-log" id="chat-log"></div>
          <form class="chat-form" id="chat-form"><input id="chat-input" maxlength="200" data-i18n-placeholder="친구들에게 한마디" placeholder="친구들에게 한마디" autocomplete="off"><button class="btn small" type="submit" data-i18n="보내기">보내기</button></form>
        </div>
      </aside>
      <div class="card settings-card">
        <div class="tabs" id="lobby-tabs">
          <button class="tab active" data-tab="presets" data-i18n="사전 설정">사전 설정</button>
          <button class="tab" data-tab="custom" data-i18n="커스텀 설정">커스텀 설정</button>
        </div>
        <div class="tab-body" id="tab-presets"></div>
        <div class="tab-body hidden" id="tab-custom"></div>
        <div class="lobby-foot">
          <div class="lobby-note" id="lobby-note"></div>
          <div class="lobby-actions">
            <button class="btn ghost" id="btn-leave" data-i18n-title="방에서 나가기" title="방에서 나가기" data-i18n="🚪 나가기">🚪 나가기</button>
            <button class="btn ghost" id="btn-invite" data-i18n="🔗 초대">🔗 초대</button>
            <button class="btn primary" id="btn-begin" data-i18n="시작">시작</button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- ───── 게임 ───── -->
  <section id="view-game" class="view">
    <div class="game-head">
      <div class="round-info" id="round-info"></div>
      <div class="progress" id="progress"></div>
      <div class="timer" id="timer">
        <svg viewBox="0 0 44 44"><circle class="tr-bg" cx="22" cy="22" r="19"/><circle class="tr-fg" id="timer-ring" cx="22" cy="22" r="19"/></svg>
        <span id="timer-num">--</span>
      </div>
    </div>

    <!-- 글 쓰기 -->
    <div id="step-write" class="phase hidden">
      <div class="card write-card">
        <h2 id="write-title"></h2>
        <p class="sub" id="write-sub"></p>
        <div class="viewer-box hidden" id="write-viewer"></div>
        <div class="suggest hidden" id="write-suggest"></div>
        <form class="write-form" id="write-form">
          <input id="write-input" maxlength="60" data-i18n-placeholder="여기에 적어 주세요" placeholder="여기에 적어 주세요" autocomplete="off">
          <button class="btn primary" type="submit" id="write-done" data-i18n="완료">완료</button>
        </form>
      </div>
    </div>

    <!-- 3D 만들기 (갈틱폰 그리기 화면처럼: 왼쪽 색, 가운데 노트, 오른쪽 도구, 아래 도형과 완료) -->
    <div id="step-build" class="phase hidden">
      <div class="gp">
        <aside class="gp-side gp-left">
          <div class="swatches" id="swatches"></div>
          <div class="hex" id="hex">#4dabf7</div>
          <div class="finishes" id="finishes"></div>
        </aside>
        <div class="gp-center">
          <div class="pad">
            <span class="ring ring-l"></span><span class="ring ring-r"></span>
            <div class="pad-head">
              <div class="modebar" id="modebar"></div>
              <small data-i18n="이제, 3D로 만드세요!">이제, 3D로 만드세요!</small>
              <div class="pad-prompt" id="build-prompt"></div>
              <div class="pad-tools" id="pad-tools"></div>
            </div>
            <div class="editor-wrap">
              <div class="editor" id="editor"></div>
              <div class="editor-msg" id="editor-msg"></div>
            </div>
          </div>
          <div class="gp-bottom">
            <div class="strip-wrap">
              <div class="ctxbar hidden" id="ctxbar"></div>
              <div class="strip" id="strip"></div>
            </div>
            <button class="done-btn" id="build-done"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 12.5l5 5 10-11"/></svg><span data-i18n="완료!">완료!</span></button>
          </div>
        </div>
        <aside class="gp-side gp-right">
          <div class="tools" id="tools"></div>
        </aside>
      </div>
    </div>

    <!-- 완료 후 대기 -->
    <div id="waiting" class="waiting hidden">
      <div class="card waiting-card">
        <h2 data-i18n="완료! 🎉">완료! 🎉</h2>
        <p data-i18n="다른 사람들이 끝낼 때까지 기다리고 있어요.">다른 사람들이 끝낼 때까지 기다리고 있어요.</p>
        <div class="progress big" id="waiting-progress"></div>
        <button class="btn ghost" id="btn-unsubmit" data-i18n="✏️ 수정하기">✏️ 수정하기</button>
      </div>
    </div>

    <!-- 구경 -->
    <div id="step-idle" class="phase hidden"><div class="card center-card"><h2 data-i18n="이번 라운드는 구경하는 중이에요">이번 라운드는 구경하는 중이에요</h2><p data-i18n="다음 라운드를 기다려 주세요.">다음 라운드를 기다려 주세요.</p></div></div>

    <!-- 앨범 공개 -->
    <div id="phase-album" class="phase hidden">
      <div class="album">
        <aside class="card album-nav" id="album-nav"></aside>
        <div class="card album-main">
          <h2 id="album-title"></h2>
          <div class="album-steps" id="album-steps"></div>
          <div class="album-ctl" id="album-ctl"></div>
        </div>
      </div>
    </div>

    <!-- 다같이 맞추기 -->
    <div id="phase-guess" class="phase hidden">
      <div class="guess">
        <div class="card guess-main">
          <div class="guess-head" id="guess-head"></div>
          <div class="viewer-box" id="guess-viewer"></div>
          <div class="guess-result hidden" id="guess-result"></div>
        </div>
        <aside class="card guess-side">
          <div class="guess-role" id="guess-role"></div>
          <div class="guess-feed" id="guess-feed"></div>
          <form class="chat-form" id="guess-form"><input id="guess-input" maxlength="60" data-i18n-placeholder="정답을 적어 보세요" placeholder="정답을 적어 보세요" autocomplete="off"><button class="btn small" type="submit" data-i18n="보내기">보내기</button></form>
          <div class="guess-ctl" id="guess-ctl"></div>
          <div class="scoreboard" id="scoreboard"></div>
        </aside>
      </div>
    </div>

    <!-- 점수 -->
