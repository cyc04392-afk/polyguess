<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-i18n="폴리게스 3D 만들기 체험판">폴리게스 3D 만들기 체험판</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpolygon points='50,8 90,30 50,52 10,30' fill='%23ffd23f'/%3E%3Cpolygon points='10,30 50,52 50,96 10,74' fill='%237b5cff'/%3E%3Cpolygon points='90,30 50,52 50,96 90,74' fill='%23ff5c7a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  /* 체험판: 게임 머리말(진행·타이머)이 없어서 높이를 다시 잡는다 */
  html, body { height: 100%; }
  #step-build { height: calc(100vh - 86px); min-height: 600px; }
  .demo-note { color: #fff; opacity: .9; font-size: 14px; }
  .preview-card { max-width: 900px; width: 100%; text-align: center; }
  .preview-card .viewer-box { height: min(60vh, 520px); margin: 10px 0 14px; }
  .preview-card p { color: var(--muted); margin: 0 0 12px; }
  @media (max-width: 1100px) { #step-build { height: auto; min-height: 0; } }
</style>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/build/three.module.js",
    "three/addons/": "./vendor/three/examples/jsm/"
  }
}
</script>
</head>
<body data-phase="build">
<script>
// 부팅 감시: 코드 파일을 못 불러오거나 시작 중에 오류가 나면 빈 화면 대신 안내 상자를 띄운다(언어 파일보다 먼저 돌아서 두 언어로 적음)
(function () {
  var box = null;
  function show(msg) {
    try {
      if (!box) { box = document.createElement('div'); box.id = 'boot-error'; box.setAttribute('role', 'alert'); document.body.appendChild(box); }
      box.textContent = '\uac8c\uc784\uc744 \ubd88\ub7ec\uc624\ub294 \uc911 \ubb38\uc81c\uac00 \uc0dd\uacbc\uc5b4\uc694. \uc0c8\ub85c\uace0\uce68(F5)\ud574 \ubcf4\uace0, \uacc4\uc18d \uadf8\ub7ec\uba74 \uc774 \ubb38\uad6c\ub97c \uc54c\ub824 \uc8fc\uc138\uc694. / Something went wrong while loading. Refresh (F5); if it keeps happening, report this: ' + msg;
    } catch (e) { /* 안내도 못 띄우면 포기 */ }
  }
  window.addEventListener('error', function (e) {
    var t = e.target;
    if (t && t !== window && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) show('load failed: ' + (t.src || t.href || '?'));
    else if (e.message) show(e.message + ' @ ' + String(e.filename || '').split('/').pop() + ':' + e.lineno);
  }, true);
  window.addEventListener('unhandledrejection', function (e) { var r = e.reason; show((r && r.message) || String(r)); });
  setTimeout(function () { if (!window.__booted) show('boot timeout (main script did not finish)'); }, 20000);
})();
</script>
<header class="topbar">
  <span class="logo">
    <svg viewBox="0 0 100 100" width="34" height="34" aria-hidden="true"><polygon points="50,8 90,30 50,52 10,30" fill="#ffd23f"/><polygon points="10,30 50,52 50,96 10,74" fill="#b89cff"/><polygon points="90,30 50,52 50,96 90,74" fill="#ff5c7a"/></svg>
    <span data-i18n="폴리게스">폴리게스</span><small data-i18n="3D 만들기 체험판">3D 만들기 체험판</small>
  </span>
  <div class="top-mid demo-note" data-i18n="서버 없이 혼자 연습하는 페이지예요. 만든 것은 이 브라우저에만 저장돼요.">서버 없이 혼자 연습하는 페이지예요. 만든 것은 이 브라우저에만 저장돼요.</div>
  <div class="top-right"><span id="lang-slot"></span><span class="chip" data-i18n="혼자 연습">혼자 연습</span></div>
</header>

<main id="app">
  <section id="view-game" class="view active">
    <div id="step-build" class="phase">
      <div class="gp">
        <aside class="gp-side gp-left">
          <div class="swatches" id="swatches"></div>
          <div class="hex" id="hex">#4dabf7</div>
          <div class="finishes" id="finishes"></div>
        </aside>
        <div class="gp-center">
          <div class="pad">
            <span class="ring ring-l"></span><span class="ring ring-r"></span>
            <div class="pad-head">
              <div class="modebar" id="modebar"></div>
              <small data-i18n="이제, 3D로 만드세요!">이제, 3D로 만드세요!</small>
              <div class="pad-prompt" id="build-prompt"></div>
              <div class="pad-tools" id="pad-tools"></div>
            </div>
            <div class="editor-wrap">
              <div class="editor" id="editor"></div>
              <div class="editor-msg" id="editor-msg"></div>
            </div>
          </div>
          <div class="gp-bottom">
            <div class="strip-wrap">
              <div class="ctxbar hidden" id="ctxbar"></div>
              <div class="strip" id="strip"></div>
            </div>
            <button class="done-btn" id="build-done"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 12.5l5 5 10-11"/></svg><span data-i18n="완료!">완료!</span></button>
          </div>
        </div>
        <aside class="gp-side gp-right">
          <div class="tools" id="tools"></div>
        </aside>
      </div>
    </div>
  </section>
</main>

<!-- 다음 사람에게 보이는 모습 -->
<div id="preview" class="modal hidden">
  <div class="card modal-card preview-card">
    <button class="modal-close" id="preview-close" data-i18n-aria="닫기" aria-label="닫기">✕</button>
    <h2 data-i18n="다음 사람에게는 이렇게 보여요">다음 사람에게는 이렇게 보여요</h2>
    <p data-i18n="글은 보이지 않고 3D만 보여요. 저절로 돌아가고, 드래그하면 직접 돌려 볼 수 있어요. 무엇인지 알아볼 수 있을까요?">글은 보이지 않고 3D만 보여요. 저절로 돌아가고, 드래그하면 직접 돌려 볼 수 있어요. 무엇인지 알아볼 수 있을까요?</p>
    <div class="viewer-box" id="preview-viewer"></div>
    <button class="btn primary" id="preview-back" data-i18n="✏️ 더 다듬기">✏️ 더 다듬기</button>
    <button class="btn ghost hidden" id="preview-replay" data-i18n-title="만드는 과정을 처음부터 다시 봐요" title="만드는 과정을 처음부터 다시 봐요" data-i18n="⏪ 과정 다시 보기">⏪ 과정 다시 보기</button>
  </div>
</div>

<!-- 도움말 -->
<div id="help" class="modal hidden">
  <div class="card modal-card">
    <button class="modal-close" id="help-close" data-i18n-aria="닫기" aria-label="닫기">✕</button>
    <h2 data-i18n="도움말">도움말</h2>
    <div class="help-body" id="help-body"></div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script type="module" src="js/demo.js"></script>
</body>
</html>
